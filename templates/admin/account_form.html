{% extends "base.html" %}
{% block title %}New Admin — EduAnalytics Admin{% endblock %}
{% block content %}
<div class="crumb"><a href="{{ url_for('admin.accounts') }}">Account Management</a> / New</div>
<div class="page-head"><div><h1>New admin account</h1></div></div>
<div class="card" style="max-width:420px;">
  <form method="post">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="6">
    <button class="btn btn-primary" style="margin-top:18px;" type="submit">Create admin account</button>
  </form>
</div>
{% endblock %}
