{% extends "base.html" %}
{% block title %}Profile — EduAnalytics{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Profile</h1></div></div>
<div class="grid-2">
  <div class="card">
    <h3>Account details</h3>
    <label>Name</label><input type="text" value="{{ user.name }}" disabled>
    <label>Email</label><input type="text" value="{{ user.email }}" disabled>
    <label>Student code</label><input type="text" value="{{ user.student_code }}" disabled>
    <label>Branch</label><input type="text" value="{{ user.branch }}" disabled>
    <div class="form-hint">Contact an administrator to change these details.</div>
  </div>
  <div class="card">
    <h3>Editable</h3>
    <form method="post">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}">
      <label for="study_hours_per_week">Study hours / week</label>
      <input type="number" step="0.5" id="study_hours_per_week" name="study_hours_per_week" value="{{ user.study_hours_per_week if user.study_hours_per_week is not none else '' }}">
      <label for="attendance_percentage">Attendance %</label>
      <input type="number" step="0.1" min="0" max="100" id="attendance_percentage" name="attendance_percentage" value="{{ user.attendance_percentage if user.attendance_percentage is not none else '' }}">
      <label for="previous_gpa">Previous GPA (out of 10)</label>
      <input type="number" step="0.01" min="0" max="10" id="previous_gpa" name="previous_gpa" value="{{ user.previous_gpa if user.previous_gpa is not none else '' }}">
      <div class="form-hint">This feeds directly into your performance prediction — keep it accurate.</div>
      <button class="btn btn-primary" style="margin-top:16px;" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
